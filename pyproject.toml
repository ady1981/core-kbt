[project]
name = "kbt_core"
version = "0.3.0"
description = "Core Knowledge Base Trajectory"
authors = [
    { name = "andrey.siver", email = "andrey.siver@gmail.com" }
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "jinja2 (>=3.1.6,<4.0.0)",
    "flask[async] (>=3.1.1,<4.0.0)",
    "requests (>=2.32.4,<3.0.0)",
    "openai (>=1.86.0,<2.0.0)",
    "python-dotenv (>=1.1.0,<2.0.0)",
    "rdflib (>=7.5.0,<8.0.0)",
    "ruamel.yaml (>=0.19.0,<0.20.0)",
    "clorm (>=1.6.2,<2.0.0)",
    "mcp[cli] (>=1.27.2,<2.0.0)",
    "langchain-openai>=1.3.3",
    "langchain-anthropic>=1.4.7",
    "langchain-tavily>=0.2.18",
    "pydantic>=2.13.4",
    "tavily-python>=0.7.26",
    "httpx>=0.28.1",
    "markdownify>=1.2.2",
    "deepagents>=0.6.12",
    "langgraph-cli[inmem]>=0.4.30",
    "langchain-google-genai>=4.2.6",
    "rich>=15.0.0",
    "jupyter>=1.1.1",
    "ipykernel>=7.3.0"
]

[tool.pytest]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
